<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="30%" stop-color="#ffedc0"/>
      <stop offset="60%" stop-color="#ffb454" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#ffb454" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7fd4ff" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#7fd4ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- bg -->
  <rect width="64" height="64" rx="13" fill="#05070f"/>
  <!-- halo glow -->
  <circle cx="32" cy="32" r="28" fill="url(#glow)"/>
  <!-- tilted orbit ring -->
  <ellipse cx="32" cy="32" rx="28" ry="10" fill="none" stroke="#7fd4ff" stroke-opacity=".3" stroke-width="0.9" transform="rotate(-28 32 32)"/>
  <!-- halo stars — sparse, random, far from center -->
  <g fill="#6ea8e0" opacity=".55">
    <circle cx="9"  cy="18" r="0.9"/>
    <circle cx="55" cy="14" r="1.0"/>
    <circle cx="57" cy="40" r="0.8"/>
    <circle cx="8"  cy="46" r="0.9"/>
    <circle cx="16" cy="56" r="0.8"/>
    <circle cx="50" cy="54" r="0.9"/>
    <circle cx="53" cy="22" r="0.7"/>
    <circle cx="11" cy="33" r="0.7"/>
  </g>
  <!-- mid stars — moderately dense, off-center -->
  <g fill="#c8b494" opacity=".8">
    <circle cx="19" cy="16" r="1.1"/>
    <circle cx="46" cy="18" r="1.2"/>
    <circle cx="49" cy="38" r="1.0"/>
    <circle cx="43" cy="49" r="1.1"/>
    <circle cx="20" cy="48" r="1.0"/>
    <circle cx="14" cy="36" r="1.1"/>
    <circle cx="30" cy="12" r="0.9"/>
    <circle cx="50" cy="30" r="0.9"/>
    <circle cx="13" cy="24" r="0.9"/>
    <circle cx="35" cy="53" r="0.9"/>
  </g>
  <!-- inner stars — dense cluster around core -->
  <g fill="#ffe4b8">
    <circle cx="25" cy="23" r="1.4"/>
    <circle cx="39" cy="24" r="1.5"/>
    <circle cx="42" cy="34" r="1.3"/>
    <circle cx="38" cy="42" r="1.4"/>
    <circle cx="26" cy="41" r="1.3"/>
    <circle cx="22" cy="32" r="1.4"/>
    <circle cx="32" cy="20" r="1.2"/>
    <circle cx="33" cy="44" r="1.2"/>
    <circle cx="21" cy="27" r="1.1"/>
    <circle cx="43" cy="28" r="1.1"/>
    <circle cx="28" cy="18" r="1.0"/>
    <circle cx="37" cy="46" r="1.0"/>
    <circle cx="44" cy="40" r="1.0"/>
    <circle cx="20" cy="38" r="1.0"/>
  </g>
  <!-- core glow + bright center -->
  <circle cx="32" cy="32" r="11" fill="url(#core)"/>
  <circle cx="32" cy="32" r="5" fill="#fff" opacity=".95"/>
  <circle cx="32" cy="32" r="2.5" fill="#fff"/>
</svg>
